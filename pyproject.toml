[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traced"
version = "0.1.0"
description = "Concurrent trace span ingestion with rolling-window storage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seth Goldman" }]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1.4.1.post1,<2", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/traced"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

